<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>データエクスポート</title>
  </head>
  <body>
    <!--
      このページは旧サイト（heartpiazukan.ryice-boardgames.com）に配置します。
      新サイト（ryona272.github.io/heartpia）のデータ引き継ぎ機能が
      このページを非表示 iframe で読み込み、localStorage の内容を postMessage で受け取ります。
    -->
    <p>このページはデータエクスポート専用ページです。直接アクセスしても何も表示されません。</p>
    <script>
      (function () {
        // 送信先を新サイトの origin のみに限定する
        const ALLOWED_ORIGIN = "https://ryona272.github.io";

        const data = {
          state:
            localStorage.getItem("heartpia-state-v2") ||
            localStorage.getItem("heartpia-state") ||
            null,
          page3:
            localStorage.getItem("heartpia-page3-cat-state-v1") || null,
        };

        // iframe 内でのみ動作させる
        if (window.parent !== window) {
          window.parent.postMessage(
            { type: "heartpia-export", data: data },
            ALLOWED_ORIGIN,
          );
        }
      })();
    </script>
  </body>
</html>
